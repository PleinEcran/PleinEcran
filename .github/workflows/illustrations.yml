name: illustrations
on:
  workflow_dispatch:
    inputs:
      article:
        description: "Un seul article (laisser vide pour tous)"
        required: false
        default: ""
jobs:
  illustrer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Chercher les illustrations libres
        run: python3 illustrations.py ${{ inputs.article }}

      - name: Chercher les visuels officiels Steam
        run: python3 steam.py ${{ inputs.article }}

      - name: Publier ce qui a été trouvé
        run: |
          git config user.name "illustrations-bot"
          git config user.email "illustrations-bot@users.noreply.github.com"
          mkdir -p /tmp/img
          cp -r assets/img/photos /tmp/img/ 2>/dev/null || true
          cp assets/js/illustrations.js /tmp/img/illustrations.js
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p assets/img/photos
          cp -r /tmp/img/photos/. assets/img/photos/ 2>/dev/null || true
          cp /tmp/img/illustrations.js assets/js/illustrations.js
          git add assets/img/photos assets/js/illustrations.js
          git diff --staged --quiet || git commit -m "Illustrations du $(date +%F)"
          git push origin main
